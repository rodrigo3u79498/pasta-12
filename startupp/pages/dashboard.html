```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard | Startup</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f1f5f9;
            color: #1e293b;
        }

        /* =========================
           TOPO
        ========================= */

        .topo {
            height: 70px;

            padding: 0 6%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #111827;

            color: white;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 22px;
        }

        .btn-sair {
            border: none;

            background: #dc2626;

            color: white;

            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        .btn-sair:hover {
            background: #b91c1c;
        }

        /* =========================
           CONTEÚDO
        ========================= */

        .container {
            width: 90%;
            max-width: 1100px;

            margin: 40px auto;
        }

        .boas-vindas {
            margin-bottom: 30px;
        }

        .boas-vindas h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .boas-vindas p {
            color: #64748b;
            font-size: 17px;
        }

        /* =========================
           CARDS
        ========================= */

        .cards {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 20px;

            margin-bottom: 30px;
        }

        .card {
            background: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .card .icone {
            font-size: 30px;

            margin-bottom: 12px;
        }

        .card h3 {
            margin-bottom: 8px;
        }

        .card p {
            color: #64748b;
        }

        /* =========================
           TAREFAS
        ========================= */

        .tarefas {
            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .tarefas h2 {
            margin-bottom: 20px;
        }

        .form-tarefa {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .form-tarefa input {
            flex: 1;

            padding: 13px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            outline: none;
        }

        .form-tarefa input:focus {
            border-color: #2563eb;
        }

        .btn-adicionar {
            border: none;

            background: #2563eb;

            color: white;

            padding: 13px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        .btn-adicionar:hover {
            background: #1d4ed8;
        }

        #listaTarefas {
            list-style: none;
        }

        .tarefa {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 14px;

            margin-bottom: 10px;

            background: #f8fafc;

            border-radius: 8px;

            border-left: 4px solid #2563eb;
        }

        .tarefa span {
            flex: 1;
        }

        .concluida {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .acoes {
            display: flex;
            gap: 7px;
        }

        .btn-concluir,
        .btn-excluir {
            border: none;

            padding: 7px 10px;

            border-radius: 6px;

            cursor: pointer;
        }

        .btn-concluir {
            background: #16a34a;
            color: white;
        }

        .btn-excluir {
            background: #dc2626;
            color: white;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 600px) {

            .topo {
                padding: 0 20px;
            }

            .container {
                width: 92%;
            }

            .form-tarefa {
                flex-direction: column;
            }

            .btn-adicionar {
                width: 100%;
            }

        }

    </style>

</head>


<body>

    <!-- =========================
         TOPO
    ========================== -->

    <header class="topo">

        <a
            href="../index.html"
            class="logo"
        >
            🚀 <strong>Startup</strong>
        </a>

        <button
            class="btn-sair"
            onclick="sair()"
        >
            Sair
        </button>

    </header>


    <!-- =========================
         CONTEÚDO
    ========================== -->

    <main class="container">

        <section class="boas-vindas">

            <h1 id="titulo">
                Olá! 👋
            </h1>

            <p>
                Organize seus estudos e mantenha sua rotina em dia.
            </p>

        </section>


        <!-- =========================
             CARDS
        ========================== -->

        <section class="cards">

            <div class="card">

                <div class="icone">
                    📚
                </div>

                <h3>
                    Tarefas
                </h3>

                <p id="totalTarefas">
                    0 tarefas
                </p>

            </div>


            <div class="card">

                <div class="icone">
                    ✅
                </div>

                <h3>
                    Concluídas
                </h3>

                <p id="tarefasConcluidas">
                    0 tarefas
                </p>

            </div>


            <div class="card">

                <div class="icone">
                    🎯
                </div>

                <h3>
                    Consistência
                </h3>

                <p>
                    Continue estudando!
                </p>

            </div>

        </section>


        <!-- =========================
             TAREFAS
        ========================== -->

        <section class="tarefas">

            <h2>
                📋 Minhas tarefas
            </h2>


            <div class="form-tarefa">

                <input
                    type="text"
                    id="novaTarefa"
                    placeholder="Ex.: Estudar matemática"
                >

                <button
                    class="btn-adicionar"
                    onclick="adicionarTarefa()"
                >
                    + Adicionar
                </button>

            </div>


            <ul id="listaTarefas"></ul>

        </section>

    </main>


    <script>

        // =========================
        // USUÁRIO LOGADO
        // =========================

        const usuario =
            JSON.parse(
                localStorage.getItem("usuarioLogado")
            );


        if (!usuario) {

            window.location.href = "login.html";

        }


        // =========================
        // NOME DO USUÁRIO
        // =========================

        if (usuario) {

            document.getElementById("titulo").textContent =
                "Olá, " + usuario.nome + "! 👋";

        }


        // =========================
        // CHAVE DAS TAREFAS
        // =========================

        const chaveTarefas =
            "tarefas_" + usuario?.email;


        // =========================
        // CARREGAR TAREFAS
        // =========================

        let tarefas =
            JSON.parse(
                localStorage.getItem(chaveTarefas) || "[]"
            );


        function salvarTarefas() {

            localStorage.setItem(
                chaveTarefas,
                JSON.stringify(tarefas)
            );

        }


        // =========================
        // MOSTRAR TAREFAS
        // =========================

        function mostrarTarefas() {

            const lista =
                document.getElementById("listaTarefas");

            lista.innerHTML = "";


            tarefas.forEach(function(tarefa, index) {

                const li =
                    document.createElement("li");

                li.className = "tarefa";


                const span =
                    document.createElement("span");

                span.textContent = tarefa.texto;


                if (tarefa.concluida) {

                    span.classList.add("concluida");

                }


                const acoes =
                    document.createElement("div");

                acoes.className = "acoes";


                const concluir =
                    document.createElement("button");

                concluir.className = "btn-concluir";

                concluir.textContent = "✓";

                concluir.onclick = function() {

                    tarefas[index].concluida =
                        !tarefas[index].concluida;

                    salvarTarefas();

                    mostrarTarefas();

                };


                const excluir =
                    document.createElement("button");

                excluir.className = "btn-excluir";

                excluir.textContent = "🗑";

                excluir.onclick = function() {

                    tarefas.splice(index, 1);

                    salvarTarefas();

                    mostrarTarefas();

                };


                acoes.appendChild(concluir);

                acoes.appendChild(excluir);


                li.appendChild(span);

                li.appendChild(acoes);


                lista.appendChild(li);

            });


            atualizarNumeros();

        }


        // =========================
        // ADICIONAR TAREFA
        // =========================

        function adicionarTarefa() {

            const input =
                document.getElementById("novaTarefa");

            const texto =
                input.value.trim();


            if (texto === "") {

                alert("Digite uma tarefa.");

                return;

            }


            tarefas.push({

                texto: texto,

                concluida: false

            });


            salvarTarefas();

            mostrarTarefas();


            input.value = "";

            input.focus();

        }


        // =========================
        // ENTER
        // =========================

        document
            .getElementById("novaTarefa")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    adicionarTarefa();

                }

            });


        // =========================
        // CONTADORES
        // =========================

        function atualizarNumeros() {

            const total =
                tarefas.length;

            const concluidas =
                tarefas.filter(
                    tarefa => tarefa.concluida
                ).length;


            document.getElementById(
                "totalTarefas"
            ).textContent =
                total + (total === 1
                    ? " tarefa"
                    : " tarefas");


            document.getElementById(
                "tarefasConcluidas"
            ).textContent =
                concluidas + (concluidas === 1
                    ? " tarefa"
                    : " tarefas");

        }


        // =========================
        // SAIR
        // =========================

        function sair() {

            localStorage.removeItem(
                "usuarioLogado"
            );

            window.location.href =
                "login.html";

        }


        // =========================
        // INICIAR
        // =========================

        mostrarTarefas();

    </script>

</body>

</html>
```
